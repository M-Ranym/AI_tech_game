<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="420" fill="#FFFFFF"/>
  <text x="640" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#1E293B">Figure 2.14 — Model Training Workflow</text>

  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="13" text-anchor="middle" fill="#1E293B">
    <rect x="20" y="150" width="190" height="100" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="115" y="185" font-weight="700">Google Speech</text>
    <text x="115" y="203" font-weight="700">Commands Dataset</text>
    <text x="115" y="228" font-size="12">labelled audio recordings</text>

    <rect x="245" y="150" width="190" height="100" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
    <text x="340" y="188" font-weight="700">Train / Validation</text>
    <text x="340" y="206" font-weight="700">Split</text>

    <rect x="470" y="150" width="220" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/>
    <text x="580" y="182" font-weight="700">Train VoiceCNN</text>
    <text x="580" y="204" font-size="12">Adam optimizer</text>
    <text x="580" y="222" font-size="12">Cross-Entropy Loss</text>

    <rect x="725" y="150" width="180" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.2"/>
    <text x="815" y="188" font-weight="700">Validate</text>
    <text x="815" y="208" font-size="12">on held-out set</text>

    <!-- decision diamond -->
    <polygon points="1080,140 1180,200 1080,260 980,200" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="1080" y="190" font-weight="700">Best</text>
    <text x="1080" y="208" font-weight="700">accuracy</text>
    <text x="1080" y="226" font-size="12">so far?</text>
  </g>

  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow7)">
    <line x1="212" y1="200" x2="243" y2="200"/>
    <line x1="437" y1="200" x2="468" y2="200"/>
    <line x1="692" y1="200" x2="723" y2="200"/>
    <line x1="907" y1="200" x2="978" y2="200"/>
  </g>

  <!-- loop back to train -->
  <path d="M 1080 260 L 1080 330 L 580 330 L 580 252" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow7)"/>
  <text x="830" y="322" text-anchor="middle" font-size="12" fill="#64748B">no — next epoch</text>

  <!-- retain best model box below diamond -->
  <rect x="990" y="300" width="230" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="1105" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#DC2626">Retain Best Model</text>
  <text x="1105" y="350" text-anchor="middle" font-size="12" fill="#7F1D1D">→ export to ONNX</text>
  <path d="M 1080 260 L 1105 298" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow7)"/>
  <text x="1150" y="278" font-size="12" fill="#64748B">yes</text>
</svg>
