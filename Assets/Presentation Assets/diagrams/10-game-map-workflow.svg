<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="780" fill="#FFFFFF"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">Figure 5.4 — Activity Workflow: Game Map</text>

  <defs>
    <marker id="arrow10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="14" fill="#1E293B">
    <rect x="280" y="65" width="440" height="64" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="500" y="90" text-anchor="middle" font-weight="700">Player Opens the Map</text>
    <text x="500" y="111" text-anchor="middle" font-size="12.5" fill="#334155">MapManager reads saved progress (PlayerPrefs)</text>

    <rect x="280" y="155" width="440" height="64" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="500" y="182" text-anchor="middle" font-weight="700">Restore Unlocked Levels</text>
    <text x="500" y="202" text-anchor="middle" font-size="12.5" fill="#334155">drone placed at its last saved position</text>

    <!-- decision -->
    <polygon points="500,255 630,320 500,385 370,320" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="500" y="312" text-anchor="middle" font-weight="700">Activity just</text>
    <text x="500" y="330" text-anchor="middle" font-weight="700">completed?</text>

    <rect x="620" y="420" width="340" height="66" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2"/>
    <text x="790" y="446" text-anchor="middle" font-weight="700" fill="#16A34A">Show Reward Panel</text>
    <text x="790" y="466" text-anchor="middle" font-size="12.5" fill="#166534">names the completed activity</text>

    <rect x="620" y="510" width="340" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2"/>
    <text x="790" y="536" text-anchor="middle" font-weight="700" fill="#16A34A">Drone Flies to Next Stop</text>
    <text x="790" y="556" text-anchor="middle" font-size="12.5" fill="#166534">lock icon fades, level unlocks</text>

    <rect x="620" y="604" width="340" height="60" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2"/>
    <text x="790" y="640" text-anchor="middle" font-weight="700" fill="#16A34A">Progress Saved</text>

    <rect x="40" y="420" width="330" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/>
    <text x="205" y="446" text-anchor="middle" font-weight="700" fill="#334155">Player Selects an Activity</text>
    <text x="205" y="466" text-anchor="middle" font-size="12.5" fill="#334155">from an unlocked stop on the map</text>

    <rect x="40" y="510" width="330" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/>
    <text x="205" y="546" text-anchor="middle" font-weight="700" fill="#334155">Load Mini-Game Scene</text>
  </g>

  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)">
    <line x1="500" y1="129" x2="500" y2="153"/>
    <line x1="500" y1="219" x2="500" y2="253"/>
  </g>
  <line x1="573" y1="360" x2="750" y2="418" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)"/>
  <text x="700" y="400" font-size="12" fill="#64748B">yes</text>
  <line x1="790" y1="486" x2="790" y2="508" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)"/>
  <line x1="790" y1="580" x2="790" y2="602" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)"/>

  <line x1="427" y1="360" x2="230" y2="418" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)"/>
  <text x="270" y="400" font-size="12" fill="#64748B">no</text>
  <line x1="205" y1="486" x2="205" y2="508" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow10)"/>
</svg>
