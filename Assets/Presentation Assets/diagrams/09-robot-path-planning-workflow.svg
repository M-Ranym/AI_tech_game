<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="980" fill="#FFFFFF"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">Figure 4.9 — Activity Workflow: Robot Path Planning</text>

  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="14" fill="#1E293B">
    <rect x="280" y="65" width="440" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="500" y="90" text-anchor="middle" font-weight="700">Generate Maze</text>
    <text x="500" y="112" text-anchor="middle" font-size="12.5" fill="#334155">round 1: random DFS layout · round 2: fixed layout</text>

    <rect x="280" y="157" width="440" height="80" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
    <text x="500" y="184" text-anchor="middle" font-weight="700">Learner Builds Movement Program</text>
    <text x="500" y="204" text-anchor="middle" font-size="12.5" fill="#334155">drag directional blocks (up/down/left/right)</text>
    <text x="500" y="222" text-anchor="middle" font-size="12.5" fill="#334155">— or — hold mic button and speak the command</text>

    <rect x="280" y="263" width="440" height="60" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
    <text x="500" y="298" text-anchor="middle" font-weight="700">Learner Presses Play</text>

    <rect x="280" y="349" width="440" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/>
    <text x="500" y="376" text-anchor="middle" font-weight="700">Robot Executes Program</text>
    <text x="500" y="398" text-anchor="middle" font-size="12.5" fill="#334155">rolls until blocked by a wall, step by step</text>

    <!-- decision 1: hits wall -->
    <polygon points="500,445 610,500 500,555 390,500" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="500" y="495" text-anchor="middle" font-weight="700">Crosses</text>
    <text x="500" y="513" text-anchor="middle" font-weight="700">a wall?</text>

    <rect x="60" y="600" width="330" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
    <text x="225" y="628" text-anchor="middle" font-weight="700" fill="#DC2626">Run Stops Immediately</text>
    <text x="225" y="650" text-anchor="middle" font-size="12.5" fill="#7F1D1D">error message shown</text>

    <!-- decision 2: reached goal -->
    <polygon points="790,595 900,650 790,705 680,650" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.2"/>
    <text x="790" y="645" text-anchor="middle" font-weight="700">Reached</text>
    <text x="790" y="663" text-anchor="middle" font-weight="700">the goal?</text>

    <rect x="640" y="760" width="330" height="70" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.2"/>
    <text x="805" y="788" text-anchor="middle" font-weight="700" fill="#16A34A">Advance to Next Round / Level</text>

    <rect x="120" y="830" width="330" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2.2"/>
    <text x="285" y="858" text-anchor="middle" font-weight="700" fill="#334155">Edit Program &amp; Retry</text>
  </g>

  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow9)">
    <line x1="500" y1="131" x2="500" y2="155"/>
    <line x1="500" y1="237" x2="500" y2="261"/>
    <line x1="500" y1="323" x2="500" y2="347"/>
    <line x1="500" y1="419" x2="500" y2="443"/>
  </g>
  <line x1="425" y1="545" x2="225" y2="598" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow9)"/>
  <text x="290" y="580" font-size="12" fill="#64748B">yes</text>
  <line x1="580" y1="520" x2="740" y2="608" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow9)"/>
  <text x="690" y="565" font-size="12" fill="#64748B">no — continues</text>

  <line x1="790" y1="705" x2="805" y2="758" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow9)"/>
  <text x="850" y="735" font-size="12" fill="#64748B">yes</text>
  <path d="M 705 665 C 500 720, 300 760, 285 828" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow9)"/>
  <text x="480" y="740" font-size="12" fill="#64748B">no — goal not reached</text>
  <path d="M 285 830 L 285 690 L 388 500" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow9)"/>
</svg>
