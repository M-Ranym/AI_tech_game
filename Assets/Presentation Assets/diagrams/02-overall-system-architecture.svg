<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="480" fill="#FFFFFF"/>
  <text x="640" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">Figure 2.1 — Overall System Architecture</text>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Progress Manager -->
  <rect x="60" y="80" width="270" height="90" rx="12" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5"/>
  <text x="195" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#0D9488">Progress Manager</text>
  <text x="195" y="140" text-anchor="middle" font-size="13" fill="#334155">singleton — tracks locked /</text>
  <text x="195" y="157" text-anchor="middle" font-size="13" fill="#334155">unlocked / finished levels</text>

  <!-- Game Map (central) -->
  <rect x="490" y="70" width="300" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text x="640" y="112" text-anchor="middle" font-size="19" font-weight="700" fill="#2563EB">Game Map</text>
  <text x="640" y="135" text-anchor="middle" font-size="13" fill="#334155">central navigation &amp;</text>
  <text x="640" y="152" text-anchor="middle" font-size="13" fill="#334155">progression hub</text>

  <!-- Save System -->
  <rect x="950" y="80" width="270" height="90" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="1085" y="118" text-anchor="middle" font-size="17" font-weight="700" fill="#D97706">Save System</text>
  <text x="1085" y="140" text-anchor="middle" font-size="13" fill="#334155">Unity PlayerPrefs —</text>
  <text x="1085" y="157" text-anchor="middle" font-size="13" fill="#334155">persists across sessions</text>

  <!-- connectors top row -->
  <line x1="330" y1="125" x2="488" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>
  <line x1="792" y1="120" x2="948" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)" marker-start="url(#arrow2)"/>

  <!-- Mini-games row -->
  <g font-size="13.5" fill="#1E293B" text-anchor="middle">
    <!-- 7 boxes -->
    <!-- box template x positions -->
    <g>
      <rect x="45"  y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="120" y="352" font-weight="700">Game 0</text>
      <text x="120" y="372">Data</text><text x="120" y="389">Gathering</text>
    </g>
    <g>
      <rect x="215" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="290" y="352" font-weight="700">Game 1</text>
      <text x="290" y="372">Data</text><text x="290" y="389">Cleaning</text>
    </g>
    <g>
      <rect x="385" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="460" y="352" font-weight="700">Game 2</text>
      <text x="460" y="372">Image</text><text x="460" y="389">Recognition</text>
    </g>
    <g>
      <rect x="555" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="630" y="352" font-weight="700">Game 3</text>
      <text x="630" y="372">Face</text><text x="630" y="389">Detection</text>
    </g>
    <g>
      <rect x="725" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="800" y="352" font-weight="700">Game 4</text>
      <text x="800" y="372">AI Agent</text><text x="800" y="389">Debugging</text>
    </g>
    <g>
      <rect x="895" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="970" y="352" font-weight="700">Game 5</text>
      <text x="970" y="372">Robot Path</text><text x="970" y="389">Planning</text>
    </g>
    <g>
      <rect x="1065" y="320" width="150" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
      <text x="1140" y="352" font-weight="700">Game 6</text>
      <text x="1140" y="372">AI Decision</text><text x="1140" y="389">Making</text>
    </g>
  </g>

  <!-- fan-out arrows from Game Map to each mini-game -->
  <g stroke="#2563EB" stroke-width="1.6" marker-end="url(#arrow2)">
    <line x1="600" y1="180" x2="120" y2="318"/>
    <line x1="615" y1="180" x2="290" y2="318"/>
    <line x1="630" y1="180" x2="460" y2="318"/>
    <line x1="640" y1="180" x2="630" y2="318"/>
    <line x1="655" y1="180" x2="800" y2="318"/>
    <line x1="670" y1="180" x2="970" y2="318"/>
    <line x1="685" y1="180" x2="1140" y2="318"/>
  </g>

  <text x="640" y="450" text-anchor="middle" font-size="13" fill="#64748B">Each mini-game operates independently and focuses on one Artificial Intelligence concept — modular &amp; easy to extend.</text>
</svg>
