<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="420" fill="#FFFFFF"/>
  <text x="640" y="38" text-anchor="middle" font-size="25" font-weight="700" fill="#1E293B">Figure 2.12 — VoiceCNN Processing Architecture</text>

  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="13.5" text-anchor="middle" fill="#1E293B">
    <rect x="30" y="150" width="180" height="110" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="120" y="185" font-weight="700">Input</text>
    <text x="120" y="205">Log-Mel</text>
    <text x="120" y="222">Spectrogram</text>
    <text x="120" y="242">98 × 40 × 1</text>

    <rect x="255" y="150" width="200" height="110" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.5"/>
    <text x="355" y="185" font-weight="700">Convolutional</text>
    <text x="355" y="205" font-weight="700">Layers</text>
    <text x="355" y="228">Acoustic feature</text>
    <text x="355" y="245">extraction</text>

    <rect x="500" y="150" width="180" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <text x="590" y="188" font-weight="700">ReLU</text>
    <text x="590" y="228" font-weight="700">Dropout</text>
    <text x="590" y="248" font-size="12" fill="#334155">(regularization)</text>

    <rect x="725" y="150" width="210" height="110" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2.5"/>
    <text x="830" y="185" font-weight="700">Fully Connected</text>
    <text x="830" y="205" font-weight="700">Layers</text>
    <text x="830" y="228">Final classification</text>

    <rect x="980" y="140" width="270" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="1115" y="172" font-weight="700">Output — 6 classes</text>
    <text x="1115" y="196" font-size="12.5">up · down · left · right</text>
    <text x="1115" y="216" font-size="12.5">unknown · silence</text>
    <text x="1115" y="240" font-size="12" fill="#334155">softmax score per class</text>
  </g>

  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow5)">
    <line x1="212" y1="205" x2="253" y2="205"/>
    <line x1="457" y1="205" x2="498" y2="205"/>
    <line x1="682" y1="205" x2="723" y2="205"/>
    <line x1="937" y1="205" x2="978" y2="205"/>
  </g>

  <text x="640" y="340" text-anchor="middle" font-size="13.5" fill="#64748B">PyTorch training → exported to ONNX → executed offline in Unity via Sentis (CPU backend)</text>
</svg>
