<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text x="640" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1E293B">Figure 1.3 — General Use Case Diagram</text>

  <!-- Actor -->
  <g stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="130" cy="330" r="22" fill="#FFFFFF"/>
    <line x1="130" y1="352" x2="130" y2="430"/>
    <line x1="95" y1="380" x2="165" y2="380"/>
    <line x1="130" y1="430" x2="100" y2="490"/>
    <line x1="130" y1="430" x2="160" y2="490"/>
  </g>
  <text x="130" y="518" text-anchor="middle" font-size="17" font-weight="600" fill="#1E293B">Player</text>
  <text x="130" y="538" text-anchor="middle" font-size="14" fill="#64748B">(child, age 5–10)</text>

  <!-- System boundary -->
  <rect x="300" y="88" width="930" height="560" rx="18" fill="#F8FAFC" stroke="#2563EB" stroke-width="2.5"/>
  <text x="765" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#2563EB">Educational AI Learning Game</text>

  <!-- Use case ellipses -->
  <g font-size="15" fill="#1E293B" text-anchor="middle">
    <ellipse cx="520" cy="200" rx="130" ry="46" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="520" y="196">Launch a Learning</text><text x="520" y="215">Session</text>

    <ellipse cx="520" cy="320" rx="130" ry="46" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="520" y="316">View the World</text><text x="520" y="335">Map</text>

    <ellipse cx="520" cy="440" rx="130" ry="46" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <text x="520" y="436">Select a</text><text x="520" y="455">Mini-Game</text>

    <ellipse cx="935" cy="200" rx="130" ry="46" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="935" y="196">View Guided</text><text x="935" y="215">Tutorial</text>

    <ellipse cx="935" cy="320" rx="130" ry="46" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="935" y="316">Play the Educational</text><text x="935" y="335">Activity</text>

    <ellipse cx="935" cy="440" rx="130" ry="46" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/>
    <text x="935" y="436">Receive Visual &amp;</text><text x="935" y="455">Audio Feedback</text>

    <ellipse cx="727" cy="565" rx="185" ry="46" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="727" y="561">Unlock Next Activity &amp;</text><text x="727" y="580">Save Progress</text>
  </g>

  <!-- Connectors -->
  <g stroke="#94A3B8" stroke-width="1.5">
    <line x1="180" y1="330" x2="390" y2="200"/>
    <line x1="180" y1="330" x2="390" y2="320"/>
    <line x1="180" y1="330" x2="390" y2="440"/>
    <line x1="180" y1="330" x2="805" y2="200"/>
    <line x1="180" y1="330" x2="805" y2="320"/>
    <line x1="180" y1="330" x2="805" y2="440"/>
    <line x1="180" y1="330" x2="542" y2="565"/>
  </g>
</svg>
