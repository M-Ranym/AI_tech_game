<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="760" fill="#FFFFFF"/>
  <text x="450" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1E293B">Figure 2.13 — Audio Preprocessing Pipeline</text>

  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <g font-size="14" fill="#1E293B">
    <!-- step template: box x=250 width=400 height=68 -->
    <rect x="230" y="75" width="440" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="450" y="100" text-anchor="middle" font-weight="700">1. Voice Recording</text>
    <text x="450" y="122" text-anchor="middle" font-size="12.5" fill="#334155">1 second clip, sampled at 16 kHz (16,000 samples)</text>

    <rect x="230" y="167" width="440" height="66" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.2"/>
    <text x="450" y="192" text-anchor="middle" font-weight="700">2. Normalization</text>
    <text x="450" y="214" text-anchor="middle" font-size="12.5" fill="#334155">reduces amplitude variation across recordings</text>

    <rect x="230" y="259" width="440" height="66" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
    <text x="450" y="284" text-anchor="middle" font-weight="700">3. Framing</text>
    <text x="450" y="306" text-anchor="middle" font-size="12.5" fill="#334155">400-sample (25 ms) frames, 160-sample (10 ms) hop → 98 frames</text>

    <rect x="230" y="351" width="440" height="66" rx="10" fill="#F0FDFA" stroke="#0D9488" stroke-width="2.2"/>
    <text x="450" y="376" text-anchor="middle" font-weight="700">4. Hann Window + FFT</text>
    <text x="450" y="398" text-anchor="middle" font-size="12.5" fill="#334155">512-point Fast Fourier Transform per frame</text>

    <rect x="230" y="443" width="440" height="66" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/>
    <text x="450" y="468" text-anchor="middle" font-weight="700">5. Mel Filterbank</text>
    <text x="450" y="490" text-anchor="middle" font-size="12.5" fill="#334155">40 triangular mel filters, 20 Hz – 8 kHz</text>

    <rect x="230" y="535" width="440" height="66" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.2"/>
    <text x="450" y="560" text-anchor="middle" font-weight="700">6. Log Compression</text>
    <text x="450" y="582" text-anchor="middle" font-size="12.5" fill="#334155">applied to the mel filter outputs</text>

    <rect x="180" y="640" width="540" height="76" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <text x="450" y="668" text-anchor="middle" font-weight="700" fill="#DC2626">7. Log-Mel Spectrogram (98 × 40)</text>
    <text x="450" y="690" text-anchor="middle" font-size="12.5" fill="#7F1D1D">input fed to VoiceCNN — identical pipeline re-implemented</text>
    <text x="450" y="705" text-anchor="middle" font-size="12.5" fill="#7F1D1D">in C# (MelSpectrogram.cs) for parity with Unity Sentis</text>
  </g>

  <g stroke="#475569" stroke-width="2.2" marker-end="url(#arrow6)">
    <line x1="450" y1="141" x2="450" y2="165"/>
    <line x1="450" y1="233" x2="450" y2="257"/>
    <line x1="450" y1="325" x2="450" y2="349"/>
    <line x1="450" y1="417" x2="450" y2="441"/>
    <line x1="450" y1="509" x2="450" y2="533"/>
    <line x1="450" y1="601" x2="450" y2="638"/>
  </g>
</svg>
